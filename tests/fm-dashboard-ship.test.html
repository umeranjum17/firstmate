<!doctype html>
<meta charset="utf-8">
<title>Ship regression check</title>
<link rel="stylesheet" href="../bin/fm-dashboard/app.css">
<style>canvas { width: 800px; height: 600px } #view { height: 900px }</style>
<pre id="result">RUNNING</pre><div id="view"></div>
<script type="module">
import * as THREE from '../bin/fm-dashboard/vendor/three-0.186.1.min.js'
import { mount } from '../bin/fm-dashboard/ship/index.js'
import { world } from '../bin/fm-dashboard/ship/scene.js'
const assert = (ok, message) => { if (!ok) throw Error(message) }
const observed = new Set(), disposed = new Set(), scenes = new Set()
const NativeObserver = ResizeObserver
window.ResizeObserver = class extends NativeObserver {
  observe(el) { observed.add(el); super.observe(el) }
  unobserve(el) { observed.delete(el); super.unobserve(el) }
  disconnect() { super.disconnect(); for (const el of observed) if (!el.isConnected) observed.delete(el) }
}
const dispatch = THREE.EventDispatcher.prototype.dispatchEvent
THREE.EventDispatcher.prototype.dispatchEvent = function(e) {
  if (e.type === 'dispose') disposed.add(this)
  return dispatch.call(this, e)
}
const update = THREE.Scene.prototype.updateMatrixWorld
THREE.Scene.prototype.updateMatrixWorld = function(...args) { scenes.add(this); return update.apply(this, args) }
const media = window.matchMedia.bind(window)
window.matchMedia = query => query.includes('prefers-reduced-motion')
  ? { matches: true, addEventListener() {}, removeEventListener() {} } : media(query)
const assets = scene => {
  const found = new Set()
  scene.traverse(o => {
    if (o.geometry && !o.isSprite) found.add(o.geometry)
    for (const m of [o.material].flat().filter(Boolean)) {
      found.add(m)
      for (const v of Object.values(m)) if (v?.isTexture) found.add(v)
    }
    if (o.shadow?.map) found.add(o.shadow.map)
  })
  return found
}
const homes = [{ id: 'main', name: 'Main', known: true, plan: 6 }, { id: 'remote', name: 'Remote', known: false, plan: 3 }]
const card = { id: 'worker', home: 'main', title: 'Build', model: 'qwen', stage: 'building', wait: 'blocked', since: null }
const data = cards => ({ homes, cards, landed: [0], cycle_p50: null })
const frame = () => new Promise(resolve => requestAnimationFrame(resolve))
try {
  const host = document.querySelector('#view'), view = mount(host, data([]))
  assert(host.textContent.includes('Stuck work unknown.'), 'missing fleet source claimed no stuck work')
  assert(!host.textContent.includes('Nothing is stuck.'), 'unknown fleet looked healthy')
  const tabs = host.querySelectorAll('[role=tab]')
  tabs[1].click()
  assert(host.textContent.includes('Crew unknown'), 'missing home claimed empty crew')
  assert([...host.querySelectorAll('.sv-flow b')].every(el => el.textContent === '≥0'), 'missing stages claimed exact zero')
  view.update(data([{ ...card, home: 'remote' }]))
  assert(host.querySelector('.sv-crew b').textContent === '≥1', 'model count lost lower bound')
  assert(host.textContent.includes('oldest unknown'), 'missing age became now')
  view.update({ ...data([]), homes: homes.map(h => ({ ...h, known: true })) })
  assert(host.textContent.includes('Nobody on deck') && host.textContent.includes('Nothing is stuck.'), 'known empty fleet lost ordinary summaries')
  await frame(); await frame()
  view.unmount()
  assert(!host.children.length, 'view failed to unmount')
  scenes.clear(); observed.clear()
  const make = () => {
    const canvas = document.createElement('canvas'), tags = document.createElement('div')
    document.body.append(canvas, tags)
    const w = world(canvas, tags)
    w.show(data([card]), 'main'); w.fit({ l: 0, r: 800, t: 0, b: 600 })
    const scene = [...scenes].at(-1)
    return { w, tags, canvas, scene }
  }
  const a = make(), initial = assets(a.scene), lead = []
  a.scene.traverse(o => { if (o.userData.arms && !o.userData.lap) lead.push(o) })
  assert(lead.length === 1, 'initial helm lead missing')
  const helm = lead[0].parent, retiredTag = a.tags.querySelector('.sv-bad'), mainAssets = assets(lead[0])
  assert(retiredTag && observed.has(retiredTag), 'blocked tag was not observed')
  a.w.show(data([card]), 'remote')
  assert(lead[0].parent === null && helm.children.length === 3, 'home switch retained old lead')
  assert(!observed.has(retiredTag) && !retiredTag.isConnected && !retiredTag.childNodes.length, 'retired tag retained observer or content')
  assert([...mainAssets].some(x => x.isBufferGeometry && disposed.has(x)), 'Main owned geometry leaked')
  a.w.show(data([card]), 'main')
  const qwen = []
  a.scene.traverse(o => { if (o.userData.lap) qwen.push(o) })
  const qAssets = assets(qwen[0])
  a.w.show(data([{ ...card, model: 'opus', wait: null }]), 'main')
  assert(qwen[0].parent === null, 'model replacement retained old worker')
  assert([...qAssets].some(x => x.isMaterial && disposed.has(x)), 'Qwen owned material leaked')
  assert(![...observed].some(el => !el.isConnected), 'cleared blocked tag retained observer')
  const heights = []
  for (const model of ['opus', 'sol', 'muse', 'qwen']) {
    a.w.show(data([{ ...card, model }]), 'main')
    a.scene.traverse(o => { if (o.userData.lap) heights.push(o.userData.top) })
    for (const x of assets(a.scene)) initial.add(x)
  }
  assert(heights.join(',') === '1.62,1.8,2.5,2.05', 'model silhouettes changed')
  const b = make(), bAssets = assets(b.scene)
  assert(![...bAssets].some(x => initial.has(x)), 'worlds share application assets')
  const remainingTags = [...a.tags.children]
  a.w.destroy()
  assert([...initial].every(x => disposed.has(x)), 'world teardown leaked scene assets')
  assert(![...bAssets].some(x => disposed.has(x)), 'teardown disposed another live world')
  assert(remainingTags.every(el => !observed.has(el) && !el.isConnected && !el.childNodes.length), 'teardown retained tags')
  b.w.show(data([card]), 'remote'); b.w.show(data([card]), 'main')
  b.w.destroy(); a.canvas.remove(); b.canvas.remove(); a.tags.remove(); b.tags.remove()
  document.querySelector('#result').textContent = 'PASS: Ship summaries, home/model transitions, tags, silhouettes and resource teardown'
} catch (e) {
  document.querySelector('#result').textContent = 'FAIL: ' + e.stack
}
</script>
