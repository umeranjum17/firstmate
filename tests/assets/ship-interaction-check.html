<!doctype html>
<meta charset="utf-8">
<title>Ship interaction regression check</title>
<link rel="stylesheet" href="../../bin/fm-dashboard/app.css">
<link rel="stylesheet" href="../../bin/fm-dashboard/ship/ship.css">
<style>#fixture { position: relative; width: 900px; height: 700px } #sea { display: block; width: 100%; height: 100% } #tags { position: absolute; top: 0; left: 0 } #view { height: 900px }</style>
<div id="fixture"><canvas id="sea"></canvas><div id="tags"></div></div><div id="view"></div><pre id="result">Running</pre>
<script type="module">
import { world } from '../../bin/fm-dashboard/ship/scene.js'
import { mount } from '../../bin/fm-dashboard/ship/index.js'
const assert = (ok, message) => { if (!ok) throw new Error(message) }
const media = new EventTarget(); media.matches = false
const original = window.matchMedia.bind(window)
window.matchMedia = q => q === '(prefers-reduced-motion: reduce)' ? media : original(q)
const card = (id, home, wait) => ({ id, home, wait, title: id, stage: 'building', model: 'sol', why: id, since: Date.now() / 1000 })
const data = { homes: [{ id: 'main', name: 'Main', known: true }, { id: 'next', name: 'Next', known: true }], cards: [card('old', 'main', 'blocked'), card('new', 'next', 'decision'), card('park', 'next', 'parked')], landed: [], cycle_p50: null }
const canvas = document.querySelector('#sea'), tags = document.querySelector('#tags')
let scene, view
const settled = id => {
  assert(!tags.classList.contains('sv-away'), 'Tags still hidden during reduced motion')
  const label = [...tags.children].find(e => e.textContent.startsWith(id === 'old' ? 'Blocked' : 'Lead decides'))
  assert(label, 'Wrong home still dressed')
  const b = label.getBoundingClientRect(), c = canvas.getBoundingClientRect()
  assert(scene.pick(b.x - c.x + b.width / 2, b.y - c.y + b.height / 2) === id, 'Card picking still disabled or stale')
}
try {
  scene = world(canvas, tags)
  scene.fit({ l: 0, r: 900, t: 0, b: 700 }); scene.show(data, 'main'); scene.start()
  scene.show(data, 'next')
  media.matches = true; media.dispatchEvent(new Event('change'))
  settled('new')
  scene.show(data, 'main'); settled('old')
  media.matches = false; media.dispatchEvent(new Event('change'))
  scene.show(data, 'next')
  media.matches = true
  scene.show(data, 'next'); settled('new')
  media.matches = false; media.dispatchEvent(new Event('change'))
  scene.show(data, 'main')
  await new Promise(resolve => setTimeout(resolve, 500))
  assert(tags.classList.contains('sv-away'), 'Ordinary sail did not animate')
  media.matches = true; media.dispatchEvent(new Event('change')); settled('old')
  scene.destroy(); scene = null
  const opened = []
  view = mount(document.querySelector('#view'), data, id => opened.push(id))
  const grab = document.querySelector('.sv-grab')
  if (grab.getAttribute('aria-expanded') === 'false') grab.click()
  for (const row of document.querySelectorAll('#view article.li')) {
    assert(row.getAttribute('role') === 'button' && row.tabIndex === 0, 'Row lacks button semantics')
    for (const key of ['Enter', ' ']) {
      const before = opened.length, event = new KeyboardEvent('keydown', { key, bubbles: true, cancelable: true })
      row.dispatchEvent(event)
      assert(event.defaultPrevented && opened.length === before + 1 && opened.at(-1) === row.dataset.card, 'Keyboard activation failed')
    }
    row.click(); assert(opened.at(-1) === row.dataset.card, 'Click activation failed')
  }
  assert(document.querySelectorAll('#view article.li').length === 3, 'Stuck or parked rows missing')
  document.querySelector('#result').textContent = 'PASS: reduced-motion settlement and stuck/parked row activation'
} catch (error) {
  document.querySelector('#result').textContent = 'FAIL: ' + error.stack
} finally {
  scene?.destroy(); view?.unmount(); window.matchMedia = original
}
</script>
