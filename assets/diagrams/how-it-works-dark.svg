<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" role="img" aria-labelledby="hiw-title hiw-desc">
  <title id="hiw-title">How Juggernaut works</title>
  <desc id="hiw-desc">One chain of six levels. The Captain sets the objective. Overwatch is the one point of contact and plans the work. Squad Leads each own their Operators; Squad Leads are optional for small fleets. Each Operator does one mission in an isolated work copy. The work moves through a brief, an isolated work copy, validation, a pull request and a merge. The outcomes are a pull request, a merged change, or a report with findings. A monitor watches the fleet and wakes Overwatch only on a real event.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="var(--grid)"/>
    </pattern>
  </defs>
  <style>
    :root {
      --bg: #0d1420; --box: #131c2b; --ink: #e8eef7; --muted: #94a2b6;
      --line: #2b3749; --accent: #77d2c6; --accent-soft: #16302f;
      --amber: #e0b06a; --amber-soft: #2a2418; --grid: #1b2433;
    }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--ink); }
    .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 2.2px; fill: var(--muted); text-transform: uppercase; }
    .title { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
    .lead { font-size: 18px; font-weight: 650; }
    .op { font-size: 15px; font-weight: 650; }
    .chiptext { font-size: 14px; font-weight: 600; }
    .sub { font-size: 13px; fill: var(--muted); }
    .chipsub { font-size: 10.5px; fill: var(--muted); }
    .small { font-size: 11px; fill: var(--muted); }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.2; }
    .soft { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
    .warm { fill: var(--amber-soft); stroke: var(--amber); stroke-width: 1.2; }
    .chip { fill: var(--box); stroke: var(--line); stroke-width: 1.1; }
    .group { fill: none; stroke: var(--line); stroke-width: 1.1; stroke-dasharray: 4 6; }
    .line { stroke: var(--line); stroke-width: 1.6; fill: none; }
    .accentline { stroke: var(--accent); stroke-width: 1.8; fill: none; }
    .dash { stroke: var(--amber); stroke-width: 1.6; fill: none; stroke-dasharray: 5 5; }
    .accentdot { fill: var(--accent); }
  </style>
  <rect width="1200" height="880" fill="var(--bg)"/>
  <rect width="1200" height="880" fill="url(#grid)" opacity="0.55"/>
  <text class="tag" x="22" y="152" text-anchor="start">Command</text>
  <rect class="box" x="500" y="46" width="300" height="78" rx="14"/>
  <circle class="accentdot" cx="524" cy="70" r="4"/>
  <text class="title" x="650" y="82" text-anchor="middle">Captain</text>
  <text class="sub" x="650" y="104" text-anchor="middle">The user. Sets the objective.</text>
  <path class="accentline" d="M650 124 L650 150" marker-end="url(#arrow-accent)"/>
  <rect class="soft" x="430" y="152" width="440" height="86" rx="14"/>
  <circle class="accentdot" cx="454" cy="176" r="4"/>
  <text class="title" x="650" y="190" text-anchor="middle">Overwatch</text>
  <text class="sub" x="650" y="212" text-anchor="middle">One point of contact. Plans the work.</text>
  <rect class="warm" x="906" y="156" width="214" height="78" rx="14"/>
  <text class="lead" x="1013" y="184" text-anchor="middle">Monitor</text>
  <text class="chipsub" x="1013" y="204" text-anchor="middle">Watches the fleet.</text>
  <text class="chipsub" x="1013" y="222" text-anchor="middle">Wakes on a real event.</text>
  <path class="dash" d="M872 195 L900 195" marker-end="url(#arrow)"/>
  <text class="tag" x="22" y="338" text-anchor="start">Squad Leads</text>
  <text class="tag" x="22" y="470" text-anchor="start">Operators</text>
  <path class="accentline" d="M650 238 L650 262 M316 262 L984 262"/>
  <path class="accentline" d="M316 262 L316 292" marker-end="url(#arrow-accent)"/>
  <path class="accentline" d="M650 262 L650 292" marker-end="url(#arrow-accent)"/>
  <path class="accentline" d="M984 262 L984 292" marker-end="url(#arrow-accent)"/>
  <rect class="group" x="158" y="292" width="316" height="232" rx="18"/>
  <rect class="box" x="171" y="300" width="290" height="100" rx="14"/>
  <text class="lead" x="316" y="328" text-anchor="middle">Squad Lead</text>
  <text class="chipsub" x="316" y="348" text-anchor="middle">One project or domain.</text>
  <text class="chipsub" x="316" y="364" text-anchor="middle">Keeps the context.</text>
  <text class="chipsub" x="316" y="380" text-anchor="middle">Owns its Operators.</text>
  <path class="line" d="M316 400 L316 418 M238 418 L394 418"/>
  <path class="line" d="M238 418 L238 430" marker-end="url(#arrow)"/>
  <path class="line" d="M394 418 L394 430" marker-end="url(#arrow)"/>
  <rect class="box" x="167" y="428" width="142" height="84" rx="14"/>
  <text class="op" x="238" y="456" text-anchor="middle">Operator</text>
  <text class="chipsub" x="238" y="476" text-anchor="middle">One mission.</text>
  <text class="chipsub" x="238" y="492" text-anchor="middle">Isolated work copy.</text>
  <rect class="box" x="323" y="428" width="142" height="84" rx="14"/>
  <text class="op" x="394" y="456" text-anchor="middle">Operator</text>
  <text class="chipsub" x="394" y="476" text-anchor="middle">One mission.</text>
  <text class="chipsub" x="394" y="492" text-anchor="middle">Isolated work copy.</text>
  <rect class="group" x="492" y="292" width="316" height="232" rx="18"/>
  <rect class="box" x="505" y="300" width="290" height="100" rx="14"/>
  <text class="lead" x="650" y="328" text-anchor="middle">Squad Lead</text>
  <text class="chipsub" x="650" y="348" text-anchor="middle">One project or domain.</text>
  <text class="chipsub" x="650" y="364" text-anchor="middle">Keeps the context.</text>
  <text class="chipsub" x="650" y="380" text-anchor="middle">Owns its Operators.</text>
  <path class="line" d="M650 400 L650 418 M572 418 L728 418"/>
  <path class="line" d="M572 418 L572 430" marker-end="url(#arrow)"/>
  <path class="line" d="M728 418 L728 430" marker-end="url(#arrow)"/>
  <rect class="box" x="501" y="428" width="142" height="84" rx="14"/>
  <text class="op" x="572" y="456" text-anchor="middle">Operator</text>
  <text class="chipsub" x="572" y="476" text-anchor="middle">One mission.</text>
  <text class="chipsub" x="572" y="492" text-anchor="middle">Isolated work copy.</text>
  <rect class="box" x="657" y="428" width="142" height="84" rx="14"/>
  <text class="op" x="728" y="456" text-anchor="middle">Operator</text>
  <text class="chipsub" x="728" y="476" text-anchor="middle">One mission.</text>
  <text class="chipsub" x="728" y="492" text-anchor="middle">Isolated work copy.</text>
  <rect class="group" x="826" y="292" width="316" height="232" rx="18"/>
  <rect class="box" x="839" y="300" width="290" height="100" rx="14"/>
  <text class="lead" x="984" y="328" text-anchor="middle">Squad Lead</text>
  <text class="chipsub" x="984" y="348" text-anchor="middle">One project or domain.</text>
  <text class="chipsub" x="984" y="364" text-anchor="middle">Keeps the context.</text>
  <text class="chipsub" x="984" y="380" text-anchor="middle">Owns its Operators.</text>
  <path class="line" d="M984 400 L984 418 M906 418 L1062 418"/>
  <path class="line" d="M906 418 L906 430" marker-end="url(#arrow)"/>
  <path class="line" d="M1062 418 L1062 430" marker-end="url(#arrow)"/>
  <rect class="box" x="835" y="428" width="142" height="84" rx="14"/>
  <text class="op" x="906" y="456" text-anchor="middle">Operator</text>
  <text class="chipsub" x="906" y="476" text-anchor="middle">One mission.</text>
  <text class="chipsub" x="906" y="492" text-anchor="middle">Isolated work copy.</text>
  <rect class="box" x="991" y="428" width="142" height="84" rx="14"/>
  <text class="op" x="1062" y="456" text-anchor="middle">Operator</text>
  <text class="chipsub" x="1062" y="476" text-anchor="middle">One mission.</text>
  <text class="chipsub" x="1062" y="492" text-anchor="middle">Isolated work copy.</text>
  <text class="tag" x="22" y="648" text-anchor="start">Work</text>
  <path class="accentline" d="M650 524 L650 606" marker-end="url(#arrow-accent)"/>
  <text class="sub" x="672" y="560" text-anchor="start">Squad Leads are optional. Small fleets run without them.</text>
  <rect class="chip" x="153" y="610" width="170" height="66" rx="10"/>
  <text class="chiptext" x="238" y="636" text-anchor="middle">Brief</text>
  <text class="chipsub" x="238" y="656" text-anchor="middle">what you asked for</text>
  <rect class="chip" x="339" y="610" width="240" height="66" rx="10"/>
  <text class="chiptext" x="459" y="636" text-anchor="middle">Isolated work copy</text>
  <text class="chipsub" x="459" y="656" text-anchor="middle">one clean copy per mission</text>
  <path class="accentline" d="M329 643 L333 643" marker-end="url(#arrow-accent)"/>
  <rect class="chip" x="595" y="610" width="174" height="66" rx="10"/>
  <text class="chiptext" x="682" y="636" text-anchor="middle">Validation</text>
  <text class="chipsub" x="682" y="656" text-anchor="middle">tests, proof, a judge</text>
  <path class="accentline" d="M585 643 L589 643" marker-end="url(#arrow-accent)"/>
  <rect class="chip" x="785" y="610" width="176" height="66" rx="10"/>
  <text class="chiptext" x="873" y="636" text-anchor="middle">Pull request</text>
  <text class="chipsub" x="873" y="656" text-anchor="middle">the change and its proof</text>
  <path class="accentline" d="M775 643 L779 643" marker-end="url(#arrow-accent)"/>
  <rect class="chip" x="977" y="610" width="168" height="66" rx="10"/>
  <text class="chiptext" x="1061" y="636" text-anchor="middle">Merge</text>
  <text class="chipsub" x="1061" y="656" text-anchor="middle">only in your authority</text>
  <path class="accentline" d="M967 643 L971 643" marker-end="url(#arrow-accent)"/>
  <text class="tag" x="22" y="768" text-anchor="start">Outcomes</text>
  <path class="accentline" d="M650 676 L650 716" marker-end="url(#arrow-accent)"/>
  <rect class="box" x="150" y="720" width="310" height="88" rx="14"/>
  <text class="lead" x="305" y="756" text-anchor="middle">A pull request</text>
  <text class="chipsub" x="305" y="778" text-anchor="middle">ready for your review</text>
  <rect class="box" x="495" y="720" width="310" height="88" rx="14"/>
  <text class="lead" x="650" y="756" text-anchor="middle">A merged change</text>
  <text class="chipsub" x="650" y="778" text-anchor="middle">inside your authority</text>
  <rect class="warm" x="840" y="720" width="310" height="88" rx="14"/>
  <text class="lead" x="995" y="756" text-anchor="middle">A report</text>
  <text class="chipsub" x="995" y="778" text-anchor="middle">findings, not a change</text>
  <text class="sub" x="650" y="848" text-anchor="middle">Objective secured: a verified result. Mission complete: the agreed finish line.</text>
</svg>
