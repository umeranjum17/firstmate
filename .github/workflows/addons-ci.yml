name: Add-ons CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Pull requests only: these checks exist so a pull request can be concluded
# (no-mistakes waits for registered checks on the PR head), and every change
# reaches main through a pull request, so a separate push run on main would
# only repeat the verdict the PR already reported.
jobs:
  self-check:
    name: Add-on self-checks
    runs-on: ubuntu-latest
    # Normal tier: a shellcheck pass and a bash parse over a handful of
    # scripts, plus the stubbed e2e tests of the memory gate, route change,
    # home flow check and GLM queue (about 20 s and a python3-yaml install).
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # An add-on script is a shell script under a top-level add-on directory,
      # either one level down (`merge-card/merge-card`, `fleet-dashboard/fm-dashboard.sh`)
      # or two levels down in its `bin/` and `tests/` subdirectories
      # (`fleet-flow/bin/fm-flow.sh`, `fleet-flow/tests/fm-flow.test.sh`), so a new
      # add-on in either shape needs no edit here and a non-script file is left alone.
      # The runner image ships shellcheck, so nothing is downloaded at run time.
      - name: ShellCheck add-on scripts
        run: |
          set -euo pipefail
          shellcheck --version
          # SC2015 is excluded because both add-ons use the deliberate
          # `A && B || fallback` idiom where the fallback is the intent:
          # ask-default's incomplete-record check and merge-card's usage guard
          # and media cap. The advisory also disagrees between the runner
          # image's ShellCheck 0.9.0 and the fleet's 0.11.0, so leaving it on
          # would make the gate follow the image instead of the code.
          # A verbatim dormant copy from the fork carries `# shellcheck
          # source=bin/...` or `source=tests/...` directives naming the sibling
          # fork libraries beside it, but those siblings did not move into this
          # repository. With -x ShellCheck cannot open them, so it reports
          # SC1091 for each missing source and, when only the unfollowed library
          # reads a variable, a follow-on SC2034. The copies are byte-identical
          # to the fork and may not be edited, so exactly those two codes are
          # exempt for those files. Every other check stays on at every severity.
          found=0
          for f in ./*/* ./*/*/*; do
            [ -f "$f" ] || continue
            head -n 1 "$f" | grep -Eq '^#!.*\b(bash|sh)\b' || continue
            found=$((found + 1))
            exclude=SC2015
            case "$f" in
              ./sentinel/*|./supervisor-guard/*|./wait-timers/bin/*|./signoff/bin/*|./host-memory/bin/*|./alerts/*|./receipts/bin/*|./fleet-stats/bin/*) exclude=SC2015,SC1091 ;;
              ./wait-timers/tests/fm-wait-timers.test.sh) exclude=SC2015,SC1091,SC2034 ;;
              ./fleet-dashboard/tests/fm-dashboard.test.sh) exclude=SC2015,SC1091,SC2034 ;;
            esac
            echo "== shellcheck -x -e $exclude $f =="
            shellcheck -x -e "$exclude" "$f"
          done
          if [ "$found" -eq 0 ]; then
            echo "no add-on script found in any <add-on>/ directory" >&2
            exit 1
          fi
      - name: Syntax-check add-on scripts
        run: |
          set -euo pipefail
          found=0
          for f in ./*/* ./*/*/*; do
            [ -f "$f" ] || continue
            head -n 1 "$f" | grep -Eq '^#!.*\b(bash|sh)\b' || continue
            found=$((found + 1))
            echo "== bash -n $f =="
            bash -n "$f"
          done
          if [ "$found" -eq 0 ]; then
            echo "no add-on script found in any <add-on>/ directory" >&2
            exit 1
          fi
      # Stub emulator, Gradle, pgrep and memory files only: nothing heavy starts.
      - name: Memory gate test
        run: bash host-memory/tests/fm-mem-gate.test.sh
      # Fixture home and config, stub quota-axi and pi: nothing real is touched.
      - name: Route change test
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-yaml
          bash route-change/tests/route-change-e2e.sh
      # Quota JSON fixtures and a private repeat-state file: nothing real is touched.
      - name: Z.AI quota check test
        run: bash zai-quota-check/tests/zai-quota-check-e2e.sh
      # Quota JSON fixtures, a throwaway home and HOME, and a stub register: nothing real is touched.
      - name: Claude quota check test
        run: bash claude-quota/tests/claude-quota.test.sh
      # Fixture homes, stub herdr and a temp state dir: nothing real is touched.
      - name: Fleet stall check test
        run: bash fleet-stall/tests/fleet-stall-e2e.sh
      # Fixture Main and lead homes with stub fm-tasks-axi.sh and fm-crew-state.sh: lane slots and dry.
      - name: Home flow check test
        run: bash fleet-flow/tests/fm-flow-check.test.sh
      # Stub upstream on 127.0.0.1 only: never reaches Z.AI.
      - name: GLM queue test
        run: bash glm-queue/tests/glm-queue.test.sh
